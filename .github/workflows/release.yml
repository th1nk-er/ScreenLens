name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package_name: screenlens-linux-amd64
            archive_extension: tar.gz
            executable_suffix: ""
          - runner: macos-latest
            package_name: screenlens-macos-arm64
            archive_extension: tar.gz
            executable_suffix: ""
          - runner: macos-15-intel
            package_name: screenlens-macos-amd64
            archive_extension: tar.gz
            executable_suffix: ""
          - runner: windows-latest
            package_name: screenlens-windows-amd64
            archive_extension: zip
            executable_suffix: .exe

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxtst-dev \
            libx11-xcb-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxinerama-dev \
            xvfb \
            xauth

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...

      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Prepare package directory
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          mkdir -p "dist/${PACKAGE_NAME}"
          cp config.example.yaml README.md LICENSE NOTICE "dist/${PACKAGE_NAME}/"

      - name: Build console binary
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "dist/${PACKAGE_NAME}/screenlens-console${EXECUTABLE_SUFFIX}" \
            ./cmd/screenlens

      - name: Build GUI binary on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          go build -trimpath -tags gui -ldflags "-s -w" \
            -o "dist/${PACKAGE_NAME}/screenlens" \
            ./cmd/screenlens

      - name: Build GUI binary on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          go build -trimpath -tags gui -ldflags "-s -w -H=windowsgui" \
            -o "dist/${PACKAGE_NAME}/screenlens.exe" \
            ./cmd/screenlens

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          tar -C "dist/${PACKAGE_NAME}" -czf "dist/${PACKAGE_NAME}.tar.gz" .

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          Compress-Archive -Path "dist/$env:PACKAGE_NAME/*" -DestinationPath "dist/$env:PACKAGE_NAME.zip" -Force

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}.${{ matrix.archive_extension }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: screenlens-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ScreenLens ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fi
