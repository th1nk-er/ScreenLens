name: build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxtst-dev \
            libx11-xcb-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxinerama-dev \
            xvfb \
            xauth

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...

      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build console variant
        run: go build -o bin/screenlens-console ./cmd/screenlens

      - name: Build GUI variant on Unix
        if: runner.os != 'Windows'
        run: go build -tags gui -o bin/screenlens ./cmd/screenlens

      - name: Build GUI variant on Windows
        if: runner.os == 'Windows'
        run: go build -tags gui -ldflags "-H=windowsgui" -o bin/screenlens.exe ./cmd/screenlens
